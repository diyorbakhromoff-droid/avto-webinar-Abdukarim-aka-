# Ishga tushirish: cp .env.example .env && (qiymatlarni to'ldiring) && docker compose up -d --build
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.seed"
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }

  bot:
    <<: *backend
    command: python -m app.bot.main
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: python -m app.worker.main
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
    depends_on: [api]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
      - storage:/data/storage:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
